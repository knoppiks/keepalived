name: GHCR Maintenance

on:
  schedule:
  - cron: '30 1 * * *'
  workflow_dispatch:

# Declare default permissions as read-only.
permissions: read-all

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - name: Cleanup Untagged Images
      uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
      with:
        delete-untagged: true
        delete-ghost-images: true
        delete-partial-images: true
        delete-orphaned-images: true

    - name: Cleanup >7d Old Images
      uses: dataaxiom/ghcr-cleanup-action@ac45a8c04b1eb4b27974ca79a0a74f344c93664b # v1.3.0
      with:
        exclude-tags: "latest,*.*.*"
        delete-tags: "pr-*,build-*"
        older-than: 7 days
